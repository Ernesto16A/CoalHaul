<style>

<div id="hud">

<div id="tp" style="display:none!important"><b>Test</b> · debug<label>Time of day</label><div class="row"><button id="tday">Morning</button><button id="tdusk">Dusk</button><button id="tnight">Night</button></div><label for="tcash">Cash (set to)</label><div class="row"><input id="tcash" type="number" step="100" inputmode="numeric" placeholder="e.g. 5000"><button id="tset">Set</button></div><label style="display:flex;align-items:center;gap:8px;margin-top:10px;cursor:pointer"><input id="tbed" type="checkbox" style="flex:none;width:18px;height:18px;padding:0;margin:0"><span>Bed type change in the garage</span></label><label style="display:flex;align-items:center;gap:8px;margin-top:10px;cursor:pointer"><input id="tcol" type="checkbox" checked style="flex:none;width:18px;height:18px;padding:0;margin:0"><span>Collision (kerbs, walls, buildings)</span></label><label style="display:flex;align-items:center;gap:8px;margin-top:10px;cursor:pointer"><input id="tgrid" type="checkbox" style="flex:none;width:18px;height:18px;padding:0;margin:0"><span>Grid: tiles and chunks</span></label><label>Construction sites</label><div class="row"><button id="tbuild">Build all</button></div><label for="ttu">Turn a building (90° clockwise)</label><div class="row"><select id="ttu"></select><button id="ttugo">Turn</button></div><label>Crane test</label><div class="row"><button id="tcrane">Crane kit at the garage</button></div><label for="ttp">Teleport player to</label><div class="row"><select id="ttp"></select><button id="ttpgo">Go</button></div><div id="tmsg" style="min-height:18px;margin-top:8px;font-size:12px;color:#ffd29f"></div></div>

<script>
const cv=document.getElementById('c'),$=id=>document.getElementById(id);let g=cv.getContext('2d');
let VW,VH,dpr;
var LOWG=false;function rs(){dpr=Math.min(devicePixelRatio||1,LOWG?1:1.5);VW=innerWidth;VH=innerHeight;cv.width=VW*dpr;cv.height=VH*dpr}
addEventListener('resize',rs);rs();

// ---------- world: an endless grid of grass tiles; the streets are tiles too ----------
const TOUCHUI=matchMedia('(pointer:coarse)').matches;let GH=32,HUDB=0;   // phone / tablet: on-screen buttons, the minimap moves to the top right
const WW=6080,WH=3840,S=20,SPX=20,KS=SPX/S,VM=1.8,TS=320,KMH=VM*SPX/S*3.6;   // one tile (S = 20 px) is 1 m. A vehicle moves speed x VM tiles every second, so the km/h dial reads speed x KMH (6.48).    // S: pixels per vehicle unit. SPX: pixels per second per unit of speed, unchanged, so vehicles still cover ground as fast as before   // WW/WH only size the minimap; the map itself never ends
const RW=72,SH=84.5,RR=TS/2,ROADW=98;   // ROADW: how far from a street's centre line a vehicle may go (the street is 72 wide, then the dirt edge, so long rigs can cut a corner a little)
         // street half-width, dirt shoulder half-width, radius of a turn tile's centre line
const NB=1,EB=2,SB=4,WB=8,ck=(c,r)=>c+','+r;
const hash=(c,r,k)=>{let h=Math.imul(c|0,374761393)+Math.imul(r|0,668265263)+Math.imul((k||0)+1,1442695041)|0;h=Math.imul(h^(h>>>13),1274126177);h^=h>>>16;return(h>>>0)/4294967296};
// 3x3 asphalt lots (coal mine, power plant), each with a one-tile entrance where a street meets it
const LOTS=[{c0:8,r0:4,c1:11,r1:7,gate:{side:'E',a:1*TS,b:2*TS}},{c0:0,r0:4,c1:3,r1:7,gate:{side:'W',a:9*TS,b:10*TS}},{c0:4,r0:4,c1:7,r1:7,gate:{side:'E',a:4*TS,b:5*TS}},{c0:16,r0:3,c1:19,r1:7,gate:{side:'W',a:1*TS,b:2*TS}},{c0:4,r0:8,c1:7,r1:12,gate:{side:'W',a:6*TS,b:7*TS}},{c0:1,r0:8,c1:4,r1:11,gate:{side:'S',a:11*TS,b:12*TS}},{c0:12,r0:4,c1:15,r1:7,gate:{side:'E',a:6*TS,b:7*TS},gates:[{side:'E',a:6*TS,b:7*TS},{side:'E',a:8*TS,b:9*TS}]},{c0:0,r0:0,c1:3,r1:3,gate:{side:'W',a:9*TS,b:10*TS}},{c0:4,r0:8,c1:7,r1:11,gate:{side:'E',a:9*TS,b:10*TS}},{c0:8,r0:8,c1:11,r1:11,gate:{side:'W',a:9*TS,b:10*TS}},{c0:12,r0:8,c1:15,r1:12,gate:{side:'N',a:13*TS,b:14*TS}},{c0:4,r0:0,c1:8,r1:3,gate:{side:'W',a:1*TS,b:2*TS}}].map(l=>({...l,x0:l.c0*TS,y0:l.r0*TS,x1:l.c1*TS,y1:l.r1*TS}));
const GATES=l=>l.gates||[l.gate];   // a lot's gates, all on one side (the fuel station has two: in and out)
// the wall pieces along one side of a lot: the side from lo to hi, less the gates on it
const sideSegs=(l,sd,lo,hi)=>{const o=[];let p=lo;for(const q of GATES(l).filter(q=>q.side===sd).sort((u,v)=>u.a-v.a)){o.push([p,q.a]);p=q.b}o.push([p,hi]);return o.filter(q=>q[1]>q[0])};
const LOTT=new Set();for(const l of LOTS)for(let c=l.c0;c<l.c1;c++)for(let r=l.r0;r<l.r1;r++)LOTT.add(ck(c,r));
const RC=new Map();   // street tiles -> the sides they connect to
function link(c,r,nc,nr){const add=(x,y,m)=>{const k=ck(x,y);if(!LOTT.has(k))RC.set(k,(RC.get(k)||0)|m)};
 if(nc>c){add(c,r,EB);add(nc,nr,WB)}else if(nc<c){add(c,r,WB);add(nc,nr,EB)}else if(nr>r){add(c,r,SB);add(nc,nr,NB)}else{add(c,r,NB);add(nc,nr,SB)}}
function road(...p){for(let i=0;i<p.length-1;i++){let c=p[i][0],r=p[i][1];const c2=p[i+1][0],r2=p[i+1][1],dc=Math.sign(c2-c),dr=Math.sign(r2-r);while(c!==c2||r!==r2){link(c,r,c+dc,r+dr);c+=dc;r+=dr}}}
// a tile with exactly two perpendicular connections is a turn: its street bends around the tile corner they share
const dm=m=>m&&!(m&(m-1))?(m<4?m<<2:m>>2)|m:m;   // a street tile with one connection is a dead end: it runs straight on to the far edge of its tile and stops there, into the grass (no rounded cap, no loose end)
const corner=m=>m===(EB|SB)?[1,1]:m===(EB|NB)?[1,-1]:m===(WB|SB)?[-1,1]:m===(WB|NB)?[-1,-1]:null;
// tile coordinates (column,row); one tile is 320 px. A 3x3 site is a ring of eight street tiles (four turns, four straights) around an island tile.
// the city is a grid of streets (rows 3 and 7, columns 3, 7, 11 and 15) with a 3x3-chunk block between them, five across and three down: every lot fills a block (the shop's 2x2 lot sits in a corner of one) and its gate opens on the street beside it
road([1,7],[17,7]);   // the lumberyard (north) and the sawmill (south) stand at its east end, with room around them to turn
road([3,1],[3,7]);   // only the streets the gates need: the middle street from the shop to the lumberyard and iron mine, and the quarry's and power plant's street up the west (the rest is free for new lots and roads)

// ---- wide bends and junctions on the main loop, so a double semi can get round (the small one-tile pieces stay everywhere else) ----
// a bend of centre-line radius 1 tile (2x2 tiles) and junctions with 3x3 tiles of flared corners; the arms run on the old street centre lines
const DIRS={E:[1,0],S:[0,1],W:[-1,0],N:[0,-1]},AL=1.5*TS,WIDE=[],WT=new Set(),WD=new Set();   // WT: street tiles the wide pieces take over; WD: the corner tiles their rounded corners also reach into (grass, but part of the collision shape)
const hubF=(f,i)=>Math.min(f.al[i],f.al[(i+1)%4])-RW;   // radius of the corner between arm i and the next arm: as big as the arms allow, so the turn fills the whole quadrant   // WT: street tiles these pieces take over
function wideCurve(c,r,a,b,big){const px=(c+.5)*TS,py=(r+.5)*TS,d1=DIRS[a],d2=DIRS[b],R=big?1.5*TS:TS;WIDE.push({k:'curve',px,py,d1,d2,R,cx:px+(d1[0]+d2[0])*R,cy:py+(d1[1]+d2[1])*R});   // big: the turn starts at the very edge of the 2x2 and ends at the other (radius 1.5 tiles, no straight stubs)
for(const t of[[0,0],d1,d2])WT.add(ck(c+t[0],r+t[1]))}
function wideHub(c,r,arms){const al=[0,0,0,0];for(const a in arms){al[('ESWN').indexOf(a)]=arms[a]*TS;const d=DIRS[a];WT.add(ck(c+d[0],r+d[1]))}for(let i=0;i<4;i++)if(al[i]&&al[(i+1)%4]){const a=DIRS['ESWN'[i]],b=DIRS['ESWN'[(i+1)%4]];WD.add(ck(c+a[0]+b[0],r+a[1]+b[1]))}
WT.add(ck(c,r));const f={k:'hub',cx:(c+.5)*TS,cy:(r+.5)*TS,al,o0:al.slice()};WIDE.push(f);return f}
   // the lumberyard's corner is a junction arm like the others, so its street follows the gate when the unit is turned


for(const k of WT)RC.delete(k);
function hubHit(f,x,y,w){const dx=x-f.cx,dy=y-f.cy;if(Math.abs(dx)<=w&&Math.abs(dy)<=w)return true;
 for(let i=0;i<4;i++){if(!f.al[i])continue;const a=i*Math.PI/2,c=Math.cos(a),s=Math.sin(a),lx=dx*c+dy*s,ly=-dx*s+dy*c;
  if(lx>=0&&lx<=f.al[i]&&Math.abs(ly)<=w)return true;
