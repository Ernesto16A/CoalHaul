<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Coal Haul</title>
<style>
:root{--bg:#1d2a1f;--ink:#f1efe6;--panel:rgba(20,24,20,.78);--accent:#f2b134;box-sizing:border-box}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d2a1f}}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS",Verdana,sans-serif;overflow:hidden;touch-action:none}
canvas{display:block;width:100%;height:100%}
#hud{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 0;display:flex;gap:10px;flex-wrap:wrap;pointer-events:none}
.p{background:var(--panel);padding:8px 12px;border-radius:6px;font-size:14px}
.p b{color:var(--accent)}
.bar{width:130px;height:8px;background:#0006;border-radius:4px;margin-top:5px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent)}
#bl{position:fixed;left:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);display:flex;flex-direction:column;align-items:flex-start;gap:8px;pointer-events:none;z-index:2}#vd{min-width:190px}#vd #vn{font-weight:bold;margin-bottom:4px}#vd .vr{font-size:13px;opacity:.95;margin-top:3px}#vd .bar{width:100%}#vd b{color:var(--accent)}
@media (pointer:coarse){#bl{bottom:calc(env(safe-area-inset-bottom,0px) + 84px)}}
#msg{max-width:min(70%,calc(100vw - 460px));position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateX(-50%);background:var(--panel);padding:8px 14px;border-radius:6px;font-size:15px;text-align:center}
#gp{display:none;position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(94vw,540px);max-height:86vh;overflow:auto;background:rgba(18,22,18,.96);border:1px solid #fff3;border-radius:10px;padding:14px 16px;font-size:14px;z-index:5;touch-action:auto}
#gp .gh{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:17px}
#gp h4{margin:14px 0 6px;color:var(--accent);font-size:13px;text-transform:uppercase;letter-spacing:.06em}
#gp .r{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid #fff1}
#gp .r small{display:block;opacity:.65;font-size:12px}#gp .dim{opacity:.4}#gp i{color:#7fd18a;font-style:normal;white-space:nowrap}
#gp button{background:#2b3a2b;color:var(--ink);border:1px solid #fff4;border-radius:6px;padding:6px 10px;font:inherit;cursor:pointer}#gp button:disabled{opacity:.35;cursor:default}
#gp .sw{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}#gp .sw button{min-width:26px;height:26px;padding:0 6px;border-radius:13px;font-size:11px;color:#fff}#gp .tabs{display:flex;gap:4px;margin:10px 0 2px;flex-wrap:wrap}#gp .tabs button.on{background:#44603f;border-color:#ffd166}
#gp img{width:76px;height:32px;object-fit:contain;flex:none;background:#0d120d;border-radius:4px;margin-right:10px}#gp .r>span{flex:1}
#gp .foot{margin-top:12px;padding-top:8px;border-top:1px solid #fff2}
#gp .ac{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}#gp .pm{min-height:20px;margin-top:8px;color:#ffd29f}
.chip{display:inline-flex;flex-direction:column;align-items:center;gap:2px;padding:3px 6px;border:1px solid transparent;border-radius:6px}.chip i{display:block;height:14px;border-radius:3px;border:1px solid rgba(0,0,0,.5)}.chip.sel{border-color:#ffd166;background:rgba(255,209,102,.15)}.chip.free{border-style:dashed}.chip small{font-size:10px;opacity:.85;white-space:nowrap}.arr{opacity:.5;margin:0 3px}
#tbtn{position:fixed;right:12px;top:calc(env(safe-area-inset-top,0px) + 10px);z-index:6;background:var(--panel);color:var(--ink);border:1px solid #fff4;border-radius:6px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer;touch-action:auto}
#tp{display:none;position:fixed;right:12px;top:calc(env(safe-area-inset-top,0px) + 50px);z-index:6;width:min(86vw,260px);background:rgba(18,22,18,.96);border:1px solid #fff3;border-radius:10px;padding:12px 14px;font-size:14px;touch-action:auto}
#tp b{color:var(--accent)}#tp label{display:block;margin:10px 0 4px;font-size:12px;opacity:.8}
#tp .row{display:flex;gap:6px}#tp input{flex:1;min-width:0;background:#0d120d;color:var(--ink);border:1px solid #fff4;border-radius:6px;padding:6px 8px;font:inherit}
#tp button{background:#2b3a2b;color:var(--ink);border:1px solid #fff4;border-radius:6px;padding:6px 12px;font:inherit;cursor:pointer}
#touch{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);display:none;justify-content:space-between;padding:0 12px}
#touch div{display:flex;gap:10px}
#touch button{width:54px;height:54px;border-radius:50%;border:2px solid #fff6;background:var(--panel);color:var(--ink);font-size:20px;touch-action:none}
@media (pointer:coarse){#touch{display:flex}#msg{bottom:calc(env(safe-area-inset-bottom,0px) + 90px)}}
</style></head><body>
<canvas id="c"></canvas>
<div id="hud">
  <div class="p">Cash <b id="cash">$0</b></div>
 <div class="p" id="goal"></div>
 <div class="p" id="hk"></div>
</div>
<button id="tbtn">Test</button>
<div id="tp"><b>Test</b> · debug<label for="tcash">Cash (set to)</label><div class="row"><input id="tcash" type="number" step="100" inputmode="numeric" placeholder="e.g. 5000"><button id="tset">Set</button></div><div id="tmsg" style="min-height:18px;margin-top:8px;font-size:12px;color:#ffd29f"></div></div>
<div id="gp"></div>
<div id="bl"><div class="p" id="selp" style="display:none;align-items:center"></div><div id="vd" class="p" style="display:none"><div id="vn"></div><div class="vr">Load <span id="cl"></span></div><div class="bar"><i id="load"></i></div><div id="dial"></div><div class="vr" style="text-align:center;margin:0 0 2px;min-height:15px"><b id="spd"></b></div><div class="vr">Fuel <span id="fl"></span></div><div class="bar"><i id="fbar"></i></div></div></div>
<div id="msg"></div>
<div id="touch"><div><button data-k="left">◀</button><button data-k="right">▶</button></div><div><button id="vb">V</button><button id="cb">C</button><button id="gb">G</button><button id="fb">F</button><button id="hb">E</button><button data-k="down">▼</button><button data-k="up">▲</button></div></div>
<script>
const cv=document.getElementById('c'),$=id=>document.getElementById(id);let g=cv.getContext('2d');
let VW,VH,dpr;
function rs(){dpr=Math.min(devicePixelRatio||1,2);VW=innerWidth;VH=innerHeight;cv.width=VW*dpr;cv.height=VH*dpr}
addEventListener('resize',rs);rs();

// ---------- world ----------
const WW=3600,WH=2200,S=20;
const smooth=pts=>{let r=pts;for(let it=0;it<4;it++){const n=[r[0]];for(let i=0;i<r.length-1;i++){const a=r[i],b=r[i+1];n.push([a[0]*.75+b[0]*.25,a[1]*.75+b[1]*.25],[a[0]*.25+b[0]*.75,a[1]*.25+b[1]*.75])}n.push(r[r.length-1]);r=n}return r};
const rr=(x0,y0,x1,y1,r)=>{const o=[[(x0+x1)/2,y0]];for(const[cx,cy,d]of[[x1-r,y0+r,-90],[x1-r,y1-r,0],[x0+r,y1-r,90],[x0+r,y0+r,180]])for(let i=0;i<=8;i++){const t=(d+i*90/8)*Math.PI/180;o.push([cx+Math.cos(t)*r,cy+Math.sin(t)*r])}o.push(o[0]);return o};
// rounded corners with a fixed radius (quadratic fillets) for the side roads
const fillet=(pts,r)=>{const o=[pts[0]];for(let i=1;i<pts.length-1;i++){const a=pts[i-1],b=pts[i],c=pts[i+1],d1=[a[0]-b[0],a[1]-b[1]],d2=[c[0]-b[0],c[1]-b[1]],l1=Math.hypot(...d1),l2=Math.hypot(...d2),u1=[d1[0]/l1,d1[1]/l1],u2=[d2[0]/l2,d2[1]/l2],an=Math.acos(Math.max(-1,Math.min(1,u1[0]*u2[0]+u1[1]*u2[1]))),t=Math.min(r/Math.tan(an/2),l1/2,l2/2),p1=[b[0]+u1[0]*t,b[1]+u1[1]*t],p2=[b[0]+u2[0]*t,b[1]+u2[1]*t];
 for(let k=0;k<=8;k++){const q=k/8;o.push([(1-q)*(1-q)*p1[0]+2*q*(1-q)*b[0]+q*q*p2[0],(1-q)*(1-q)*p1[1]+2*q*(1-q)*b[1]+q*q*p2[1]])}}
 o.push(pts[pts.length-1]);return o};
// nearest point on a road, so every side road starts exactly on the road it joins
const snap=(r,p)=>{let b=null,bd=1e9;for(let i=0;i<r.length-1;i++){const a=r[i],c=r[i+1],dx=c[0]-a[0],dy=c[1]-a[1],t=Math.max(0,Math.min(1,((p[0]-a[0])*dx+(p[1]-a[1])*dy)/(dx*dx+dy*dy||1))),q=[a[0]+t*dx,a[1]+t*dy],d=Math.hypot(p[0]-q[0],p[1]-q[1]);if(d<bd){bd=d;b=q}}return b};
const trunk=smooth([[780,390],[1300,390],[1700,700],[1700,1200],[2200,1650],[2700,1600]]),mring=rr(330,240,780,540,100),pring=rr(2700,1450,3140,1750,100);
const roads=[trunk,mring,pring,
 fillet([snap(trunk,[1000,390]),[1000,200],[1340,200],snap(trunk,[1340,430])],70),   // fuel station loop (leaves and rejoins the trunk)
 fillet([snap(trunk,[1700,960]),[700,960],[700,600],snap(mring,[700,600])],90),      // garage road through the bay, up to the mine ring
 smooth([snap(trunk,[1700,690]),[2000,560],[2300,520],[2920,520]]),                  // lumberyard road
 [[2920,520],[2920,1450]],                                                            // connector: lumberyard, sawmill, power plant ring
 [snap(trunk,[1700,1120]),[2920,1120]]];                                              // shop road, joins the connector

const load={x:560,y:540,w:224,h:80}, dump={x:2920,y:1750,w:224,h:80}, lz={x:2560,y:520,w:224,h:80}, garage={x:1050,y:960,w:340,h:88}, sellZ={x:2200,y:1120,w:300,h:88}, fz={x:1170,y:200,w:200,h:80}, swz={x:2920,y:910,w:90,h:260};
const yards=[{x0:240,y0:170,x1:870,y1:610,c:'#8a6a43'},{x0:2620,y0:1370,x1:3220,y1:1830,c:'#8f9298'},{x0:800,y0:760,x1:1300,y1:1160,c:'#80838a'},{x0:2300,y0:260,x1:2950,y1:800,c:'#7a6244'},{x0:1800,y0:980,x1:2400,y1:1260,c:'#80838a'},{x0:940,y0:40,x1:1400,y1:330,c:'#80838a'},{x0:2780,y0:830,x1:3300,y1:1190,c:'#7d7466'}];
const noTree=[...yards,{x0:3190,y0:1400,x1:3460,y1:1780},{x0:0,y0:150,x1:290,y1:620}];
const inRect=(r,x,y,m=0)=>x>r.x0-m&&x<r.x1+m&&y>r.y0-m&&y<r.y1+m;
const inYard=(x,y)=>yards.some(r=>inRect(r,x,y));
const segs=[];roads.forEach(r=>{for(let i=0;i<r.length-1;i++)segs.push([r[i],r[i+1]])});
function distSeg(px,py,a,b){const dx=b[0]-a[0],dy=b[1]-a[1],t=Math.max(0,Math.min(1,((px-a[0])*dx+(py-a[1])*dy)/(dx*dx+dy*dy||1)));return Math.hypot(px-(a[0]+t*dx),py-(a[1]+t*dy))}
const dRoad=(x,y)=>{let m=1e9;for(const s of segs)m=Math.min(m,distSeg(x,y,s[0],s[1]));return m};
const onRoad=(x,y)=>dRoad(x,y)<70||inYard(x,y);
let sd=7;const rnd=()=>(sd=(sd*16807)%2147483647)/2147483647;
const trees=[];for(let n=0;n<5000&&trees.length<320;n++){const x=rnd()*WW,y=rnd()*WH;if(dRoad(x,y)>150&&!noTree.some(r=>inRect(r,x,y,50)))trees.push([x,y,16+rnd()*14])}

// ---------- buildings & economy ----------
let power=0;
const mine={stock:50,cap:50,lvl:0,rate:1.5,name:'Mine',unit:'t'};
const plant={stock:0,cap:50,lvl:0,burn:1,name:'Power plant',unit:'t'};
const lumber={built:false,need:10,got:0,stock:0,cap:50,lvl:0,rate:.8,name:'Lumberyard',unit:'logs'};
const sawmill={stock:0,cap:50,lvl:0,burn:1,name:'Sawmill',unit:'logs'};let planks=0;
const pads=[{x:600,y:390,w:110,h:80,b:mine},{x:2920,y:1600,w:110,h:80,b:plant},{x:2800,y:690,w:110,h:80,b:lumber},{x:1100,y:1090,w:110,h:80,enter:1},{x:900,y:1090,w:110,h:80,gup:1},{x:2000,y:1215,w:110,h:80,shop:1},{x:3130,y:1010,w:110,h:80,b:sawmill}];
const MAXLVL=19,STEP=50,upCost=b=>125*(b.lvl+1);
const DMAX=120,DA0=135,DSW=270,dial=(()=>{const c=60,cy=58,r=46,pt=(a,d)=>[c+Math.cos(a*Math.PI/180)*d,cy+Math.sin(a*Math.PI/180)*d],f=n=>n.toFixed(1);
const arc=(a0,a1)=>{const p=pt(a0,r),q=pt(a1,r);return'M'+f(p[0])+' '+f(p[1])+'A'+r+' '+r+' 0 1 1 '+f(q[0])+' '+f(q[1])};
let s='<svg viewBox="0 0 120 100" width="150" height="125" style="display:block;margin:0 auto">';
s+='<path d="'+arc(DA0,DA0+DSW)+'" fill="none" stroke="currentColor" stroke-opacity=".15" stroke-width="6" stroke-linecap="round"/>';
s+='<path id="dpr" d="'+arc(DA0,DA0+DSW)+'" fill="none" style="stroke:var(--accent)" stroke-width="6" stroke-linecap="round" pathLength="100" stroke-dasharray="0 100"/>';
for(let v=0;v<=DMAX;v+=10){const a=DA0+DSW*v/DMAX,M=v%20===0,p=pt(a,r-6),q=pt(a,r-(M?14:10));s+='<line x1="'+f(p[0])+'" y1="'+f(p[1])+'" x2="'+f(q[0])+'" y2="'+f(q[1])+'" stroke="currentColor" stroke-opacity="'+(M?.85:.45)+'" stroke-width="'+(M?1.6:1)+'"/>';
if(M){const l=pt(a,r-22);s+='<text x="'+f(l[0])+'" y="'+f(l[1])+'" text-anchor="middle" dominant-baseline="central" font-size="7.5" fill="currentColor" fill-opacity=".8">'+v+'</text>'}}
s+='<g id="dnd" transform="rotate('+DA0+' '+c+' '+cy+')"><line x1="'+(c-7)+'" y1="'+cy+'" x2="'+(c+r-10)+'" y2="'+cy+'" stroke="#ff5a3c" stroke-width="2.5" stroke-linecap="round"/></g><circle cx="'+c+'" cy="'+cy+'" r="4.5" fill="#2a2d33" stroke="#ff5a3c" stroke-width="1.5"/>';
s+='<text id="dnum" x="'+c+'" y="86" text-anchor="middle" font-size="16" font-weight="bold" fill="currentColor">0</text><text x="'+c+'" y="96" text-anchor="middle" font-size="7" fill="currentColor" fill-opacity=".7">km/h</text></svg>';
const el=document.getElementById('dial');el.innerHTML=s;return{n:el.querySelector('#dnd'),p:el.querySelector('#dpr'),t:el.querySelector('#dnum')}})();
const padOn=q=>!(q.b===lumber&&!lumber.built);

// ---------- input ----------
const K={};
const keys={w:'up',arrowup:'up',s:'down',arrowdown:'down',a:'left',arrowleft:'left',d:'right',arrowright:'right',' ':'brake'};
addEventListener('keydown',e=>{if(e.target&&e.target.tagName=='INPUT'){if(e.key=='Enter')$('tset').click();return}const k=e.key.toLowerCase();if(e.repeat)return;if(k=='e'){interact();return}if(k=='f'){getInOut();return}if(k=='g'){dumpCargo();return}if(k=='c'){couple();return}if(k=='v'){cycleTrailer();return}if(keys[k]){K[keys[k]]=1;e.preventDefault()}});
addEventListener('keyup',e=>{const k=keys[e.key.toLowerCase()];if(k)K[k]=0});
document.querySelectorAll('#touch button[data-k]').forEach(b=>{const k=b.dataset.k;b.addEventListener('pointerdown',e=>{K[k]=1;b.setPointerCapture(e.pointerId)});['pointerup','pointercancel'].forEach(t=>b.addEventListener(t,()=>K[k]=0))});
$('hb').addEventListener('pointerdown',()=>interact());$('cb').addEventListener('pointerdown',()=>couple());$('vb').addEventListener('pointerdown',()=>cycleTrailer());$('fb').addEventListener('pointerdown',()=>getInOut());$('gb').addEventListener('pointerdown',()=>dumpCargo());

// ---------- fleet: several tractors and trailers can be out at once (Roundhaul physics, units of S px) ----------
const TKINDS={
 pickup:{n:'Pickup',ax:1,wb:2.4,maxst:Math.PI/3,vmax:6.5,acc:6,b0:-1,b1:3,cab0:1.4,hx:-1.1,cap:5,trl:'small',tl:['small','dolly'],cost:400,fuel:60,burn:.5},
 dump:{n:'Dump truck',ax:1.6,wb:3.6,maxst:70*Math.PI/180,vmax:6,acc:5,b0:-1.4,b1:4.6,cab0:2.9,hx:-1.5,cap:12,trl:'medium',tl:['medium','dolly'],cost:700,fuel:100,burn:.8},
 semi:{n:'Semi truck',ax:1.3,wb:2.7,maxst:70*Math.PI/180,vmax:6,acc:4.5,b0:-1,b1:3.6,cab0:1.5,hx:.2,cap:0,trl:'semi',tl:['semi'],cost:1200,fuel:160,burn:1.1}};
const TRL={
 pc:{n:'Small coal trailer',cls:'small',bar:3,co:0,hw:1.5,hh:.9,cap:6,cargo:'coal',cost:120},
 pl:{n:'Small log trailer',cls:'small',bar:3,co:0,hw:1.5,hh:.9,cap:8,cargo:'logs',cost:180},
 pf:{n:'Small fuel trailer',cls:'small',bar:3,co:0,hw:1.5,hh:.9,cap:150,cargo:'fuel',cost:220},
 tc:{n:'Medium coal trailer',cls:'medium',bar:3.5,co:0,hw:2,hh:1,cap:12,cargo:'coal',cost:200},
 tl:{n:'Medium log trailer',cls:'medium',bar:3.5,co:0,hw:2,hh:1,cap:15,cargo:'logs',cost:300},
 sc:{n:'Semi coal trailer',cls:'semi',bar:6.2,co:3,hw:4,hh:1,cap:25,cargo:'coal',king:1,cost:500},
 sl:{n:'Semi log trailer',cls:'semi',bar:6.2,co:3,hw:4,hh:1,cap:40,cargo:'logs',king:1,cost:700},
 dl:{n:'Dolly',cls:'dolly',bar:2,co:0,hw:.5,hh:1,cap:0,cargo:'none',fifth:-.2,cost:150}};
let nid=1;const veh={},trl={},cnt={};
function addVeh(kind,o){o=o||{};const id='v'+nid++;cnt[kind]=(cnt[kind]||0)+1;return veh[id]={id,kind,bed:o.bed||(kind=='dump'?'coal':null),color:o.color||null,name:TKINDS[kind].n+(o.bed=='logs'?' (log bed)':'')+' #'+cnt[kind],out:false,x:0,y:0,a:0,v:0,st:0,fuel:TKINDS[kind].fuel,cargo:{type:null,amt:0},tr:null}}
function addTrl(kind,col){const id='t'+nid++;cnt[kind]=(cnt[kind]||0)+1;return trl[id]={id,on:true,kind,color:col||null,name:TRL[kind].n+' #'+cnt[kind],out:false,x:0,y:0,b:0,hx:0,hy:0,kx:0,ky:0,coupled:false,host:null,tr:null,cargo:{type:null,amt:0}}}
const NOTR={on:false,kind:null,coupled:false,host:null,cargo:{type:null,amt:0}};
const JACK=1.75,TURNBRAKE=.5,STEERRATE=1,VINNER=.5,FUELP=1.5;
let T=addVeh('pickup'),R=NOTR,KD=TKINDS.pickup;
const setActive=v=>{T=v;KD=TKINDS[v.kind];R=v.tr||NOTR};
const P={x:0,y:0,a:0,driving:true};
const dir=a=>[Math.cos(a),Math.sin(a)];
const ang=a=>{while(a>Math.PI)a-=2*Math.PI;while(a<-Math.PI)a+=2*Math.PI;return a};
const hitchPt=v=>({x:v.x+Math.cos(v.a)*TKINDS[v.kind].hx*S,y:v.y+Math.sin(v.a)*TKINDS[v.kind].hx*S});
const tipPt=t=>({x:t.x+Math.cos(t.b)*TRL[t.kind].bar*S,y:t.y+Math.sin(t.b)*TRL[t.kind].bar*S});
const chainOf=v=>{const o=[];let t=v.tr;while(t){o.push(t);t=t.tr}return o},chain=()=>chainOf(T);
const hostPt=h=>('b' in h)?{x:h.x+Math.cos(h.b)*TRL[h.kind].fifth*S,y:h.y+Math.sin(h.b)*TRL[h.kind].fifth*S}:hitchPt(h);
// the free hitch of the driven rig: the truck's own hitch, or the fifth wheel of a dolly that is still empty
function freeHost(){if(!T.out)return null;const ch=chain();if(!ch.length){const p=hitchPt(T);return{x:p.x,y:p.y,cls:KD.tl,host:T}}
 const l=ch[ch.length-1];if(TRL[l.kind].fifth!==undefined&&!l.tr){const p=hostPt(l);return{x:p.x,y:p.y,cls:['semi'],host:l}}return null}
const loc=(wx,wy,ox,oy,a)=>{const dx=wx-ox,dy=wy-oy,c=Math.cos(a),s=Math.sin(a);return[c*dx+s*dy,-s*dx+c*dy]};
const wld=(lx,ly,ox,oy,a)=>{const c=Math.cos(a),s=Math.sin(a);return[ox+c*lx-s*ly,oy+s*lx+c*ly]};
const rectPts=(x0,x1,h)=>{const o=[];for(let u=x0;u<=x1+1e-6;u+=.3)o.push([u,-h],[u,h]);for(let v=-h;v<=h+1e-6;v+=.3)o.push([x0,v],[x1,v]);return o};
