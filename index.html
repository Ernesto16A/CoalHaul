<style>

#hud{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 0;display:flex;gap:10px;flex-wrap:wrap;pointer-events:none}

#gp{display:none;position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(94vw,640px);height:min(86vh,640px);overflow-y:auto;scrollbar-gutter:stable;box-sizing:border-box;background:rgba(18,22,18,.96);border:1px solid #fff3;border-radius:10px;padding:14px 16px;font-size:14px;z-index:5;touch-action:auto}

.chip{display:inline-flex;flex-direction:column;align-items:center;gap:2px;padding:3px 6px;border:1px solid transparent;border-radius:6px}.chip i{display:block;height:14px;border-radius:3px;border:1px solid rgba(0,0,0,.5)}.chip.sel{border-color:#ffd166;background:rgba(255,209,102,.15)}.chip.free{border-style:dashed}.chip small{font-size:10px;opacity:.85;white-space:nowrap}.arr{opacity:.5;margin:0 3px}
#goal{position:fixed;right:12px;top:calc(env(safe-area-inset-top,0px) + 10px);z-index:6;max-width:min(70vw,380px)}   /* the goal sits in the top right corner, over the Test button and its panel */

@media (pointer:coarse){#touch{display:flex}#msg{bottom:calc(env(safe-area-inset-bottom,0px) + 150px)}#gp button{padding:10px 14px;min-height:42px}#gp .sw button{min-width:36px;height:36px}#tbtn,#tp button{padding:9px 14px}#hud{padding-right:78px}.p{font-size:13px;padding:6px 10px}}

@media (pointer:coarse) and (max-height:520px){#touch{--bs:min(48px,12vh);--js:min(120px,32vh)}#vd .bar{height:6px}#hud .p{padding:4px 8px}}
</style></head><body>
<canvas id="c"></canvas>
<div id="hud">
  <div class="p">Cash <b id="cash">$0</b></div>
 <div class="p" id="goal"></div>
 <div class="p" id="hk"></div>
</div>
<button id="tbtn">Test</button>
<div id="tp"><b>Test</b> · debug<label for="tcash">Cash (set to)</label><div class="row"><input id="tcash" type="number" step="100" inputmode="numeric" placeholder="e.g. 5000"><button id="tset">Set</button></div><label style="display:flex;align-items:center;gap:8px;margin-top:10px;cursor:pointer"><input id="tbed" type="checkbox" style="flex:none;width:18px;height:18px;padding:0;margin:0"><span>Bed type change in the garage</span></label><label style="display:flex;align-items:center;gap:8px;margin-top:10px;cursor:pointer"><input id="tcol" type="checkbox" checked style="flex:none;width:18px;height:18px;padding:0;margin:0"><span>Collision (kerbs, walls, buildings)</span></label><label style="display:flex;align-items:center;gap:8px;margin-top:10px;cursor:pointer"><input id="tgrid" type="checkbox" style="flex:none;width:18px;height:18px;padding:0;margin:0"><span>Grid: tiles and chunks</span></label><label>Construction sites</label><div class="row"><button id="tbuild">Build all</button></div><label for="ttu">Turn a building (90° clockwise)</label><div class="row"><select id="ttu"></select><button id="ttugo">Turn</button></div><label for="ttp">Teleport player to</label><div class="row"><select id="ttp"></select><button id="ttpgo">Go</button></div><div id="tmsg" style="min-height:18px;margin-top:8px;font-size:12px;color:#ffd29f"></div></div>
<div id="gp"></div>
<div id="bl"><div class="p" id="selp" style="display:none;align-items:center"></div><div id="vd" class="p" style="display:none"><div id="vn"></div><div class="vr">Load <span id="cl"></span></div><div class="bar"><i id="load"></i></div><div id="dial"></div><div class="vr" style="text-align:center;margin:0 0 2px;min-height:15px"><b id="spd"></b></div><div class="vr">Fuel <span id="fl"></span></div><div class="bar"><i id="fbar"></i></div></div></div>
<div id="msg"></div>
<div id="touch"><div id="stick"><div id="knob"></div></div><div class="ac"><button id="vb">V</button><button id="cb">C</button><button id="gb">G</button><button id="hb" class="e">␣</button></div></div>
<script>
const cv=document.getElementById('c'),$=id=>document.getElementById(id);let g=cv.getContext('2d');
let VW,VH,dpr;
function rs(){dpr=Math.min(devicePixelRatio||1,1.5);VW=innerWidth;VH=innerHeight;cv.width=VW*dpr;cv.height=VH*dpr}
addEventListener('resize',rs);rs();

// ---------- world: an endless grid of grass tiles; the streets are tiles too ----------
const TOUCHUI=matchMedia('(pointer:coarse)').matches;   // phone / tablet: on-screen buttons, the minimap moves to the top right
const WW=6080,WH=3520,S=20,SPX=20,KS=SPX/S,VM=1.8,TS=320;   // VM: vehicles travel VM times faster than SPX says, so the km/h dial (speed x 9) matches the picture: 1 vehicle unit is about 1.4 m, 20 px   // S: pixels per vehicle unit. SPX: pixels per second per unit of speed, unchanged, so vehicles still cover ground as fast as before   // WW/WH only size the minimap; the map itself never ends
const RW=72,SH=84.5,RR=TS/2,ROADW=98;   // ROADW: how far from a street's centre line a vehicle may go (the street is 72 wide, then the dirt edge, so long rigs can cut a corner a little)
         // street half-width, dirt shoulder half-width, radius of a turn tile's centre line
const NB=1,EB=2,SB=4,WB=8,ck=(c,r)=>c+','+r;
const hash=(c,r,k)=>{let h=Math.imul(c|0,374761393)+Math.imul(r|0,668265263)+Math.imul((k||0)+1,1442695041)|0;h=Math.imul(h^(h>>>13),1274126177);h^=h>>>16;return(h>>>0)/4294967296};
// 3x3 asphalt lots (coal mine, power plant), each with a one-tile entrance where a street meets it
const LOTS=[{c0:8,r0:4,c1:11,r1:7,gate:{side:'E',a:1*TS,b:2*TS}},{c0:0,r0:4,c1:3,r1:7,gate:{side:'W',a:9*TS,b:10*TS}},{c0:4,r0:4,c1:7,r1:7,gate:{side:'E',a:4*TS,b:5*TS}},{c0:16,r0:4,c1:19,r1:7,gate:{side:'W',a:1*TS,b:2*TS}},{c0:4,r0:8,c1:7,r1:11,gate:{side:'W',a:6*TS,b:7*TS}},{c0:1,r0:8,c1:3,r1:10,gate:{side:'S',a:10*TS,b:11*TS}},{c0:12,r0:4,c1:15,r1:7,gate:{side:'E',a:6*TS,b:7*TS},gates:[{side:'E',a:6*TS,b:7*TS},{side:'E',a:8*TS,b:9*TS}]},{c0:0,r0:0,c1:3,r1:3,gate:{side:'W',a:9*TS,b:10*TS}},{c0:16,r0:8,c1:19,r1:11,gate:{side:'E',a:9*TS,b:10*TS}}].map(l=>({...l,x0:l.c0*TS,y0:l.r0*TS,x1:l.c1*TS,y1:l.r1*TS}));
const GATES=l=>l.gates||[l.gate];   // a lot's gates, all on one side (the fuel station has two: in and out)
// the wall pieces along one side of a lot: the side from lo to hi, less the gates on it
const sideSegs=(l,sd,lo,hi)=>{const o=[];let p=lo;for(const q of GATES(l).filter(q=>q.side===sd).sort((u,v)=>u.a-v.a)){o.push([p,q.a]);p=q.b}o.push([p,hi]);return o.filter(q=>q[1]>q[0])};
const LOTT=new Set();for(const l of LOTS)for(let c=l.c0;c<l.c1;c++)for(let r=l.r0;r<l.r1;r++)LOTT.add(ck(c,r));
const RC=new Map();   // street tiles -> the sides they connect to
function link(c,r,nc,nr){const add=(x,y,m)=>{const k=ck(x,y);if(!LOTT.has(k))RC.set(k,(RC.get(k)||0)|m)};
 if(nc>c){add(c,r,EB);add(nc,nr,WB)}else if(nc<c){add(c,r,WB);add(nc,nr,EB)}else if(nr>r){add(c,r,SB);add(nc,nr,NB)}else{add(c,r,NB);add(nc,nr,SB)}}
function road(...p){for(let i=0;i<p.length-1;i++){let c=p[i][0],r=p[i][1];const c2=p[i+1][0],r2=p[i+1][1],dc=Math.sign(c2-c),dr=Math.sign(r2-r);while(c!==c2||r!==r2){link(c,r,c+dc,r+dr);c+=dc;r+=dr}}}
// a tile with exactly two perpendicular connections is a turn: its street bends around the tile corner they share
const corner=m=>m===(EB|SB)?[1,1]:m===(EB|NB)?[1,-1]:m===(WB|SB)?[-1,1]:m===(WB|NB)?[-1,-1]:null;
// tile coordinates (column,row); one tile is 320 px. A 3x3 site is a ring of eight street tiles (four turns, four straights) around an island tile.
// the city is a grid of streets (rows 3 and 7, columns 3, 7, 11 and 15) with a 3x3-chunk block between them, five across and three down: every lot fills a block (the shop's 2x2 lot sits in a corner of one) and its gate opens on the street beside it
road([0,3],[18,3]);road([0,7],[18,7]);
for(const c of[3,7,11,15])road([c,0],[c,10]);

// ---- wide bends and junctions on the main loop, so a double semi can get round (the small one-tile pieces stay everywhere else) ----
// a bend of centre-line radius 1 tile (2x2 tiles) and junctions with 3x3 tiles of flared corners; the arms run on the old street centre lines
const DIRS={E:[1,0],S:[0,1],W:[-1,0],N:[0,-1]},AL=1.5*TS,WIDE=[],WT=new Set(),WD=new Set();   // WT: street tiles the wide pieces take over; WD: the corner tiles their rounded corners also reach into (grass, but part of the collision shape)
const hubF=(f,i)=>Math.min(f.al[i],f.al[(i+1)%4])-RW;   // radius of the corner between arm i and the next arm: as big as the arms allow, so the turn fills the whole quadrant   // WT: street tiles these pieces take over
function wideCurve(c,r,a,b){const px=(c+.5)*TS,py=(r+.5)*TS,d1=DIRS[a],d2=DIRS[b];WIDE.push({k:'curve',px,py,d1,d2,cx:px+(d1[0]+d2[0])*TS,cy:py+(d1[1]+d2[1])*TS});for(const t of[[0,0],d1,d2])WT.add(ck(c+t[0],r+t[1]))}
function wideHub(c,r,arms){const al=[0,0,0,0];for(const a in arms){al[('ESWN').indexOf(a)]=arms[a]*TS;const d=DIRS[a];WT.add(ck(c+d[0],r+d[1]))}for(let i=0;i<4;i++)if(al[i]&&al[(i+1)%4]){const a=DIRS['ESWN'[i]],b=DIRS['ESWN'[(i+1)%4]];WD.add(ck(c+a[0]+b[0],r+a[1]+b[1]))}
WT.add(ck(c,r));const f={k:'hub',cx:(c+.5)*TS,cy:(r+.5)*TS,al};WIDE.push(f);return f}
   // the lumberyard's corner is a junction arm like the others, so its street follows the gate when the unit is turned


for(const k of WT)RC.delete(k);
function hubHit(f,x,y,w){const dx=x-f.cx,dy=y-f.cy;if(Math.abs(dx)<=w&&Math.abs(dy)<=w)return true;
 for(let i=0;i<4;i++){if(!f.al[i])continue;const a=i*Math.PI/2,c=Math.cos(a),s=Math.sin(a),lx=dx*c+dy*s,ly=-dx*s+dy*c;
  if(lx>=0&&lx<=f.al[i]&&Math.abs(ly)<=w)return true;
  if(f.al[(i+1)%4]){const F=hubF(f,i);if(lx>=w&&lx<=RW+F&&ly>=w&&ly<=RW+F&&Math.hypot(lx-RW-F,ly-RW-F)>=F-(w-RW))return true}}
 return false}
function curveHit(f,x,y,w){const px=x-f.px,py=y-f.py;
 for(const d of[f.d1,f.d2]){const al=px*d[0]+py*d[1],pp=-px*d[1]+py*d[0];if(al>=TS&&al<=AL&&Math.abs(pp)<=w)return true}
 const vx=x-f.cx,vy=y-f.cy;if(-(vx*f.d1[0]+vy*f.d1[1])>=0&&-(vx*f.d2[0]+vy*f.d2[1])>=0){const d=Math.hypot(vx,vy);return d>TS-w&&d<TS+w}
 return false}
// loading / unloading places sit on straight street tiles
const lz={x:5280,y:480,w:240,h:80},   /* fsz: the fuel station's ITEMS area, east of its container, 1 tile off the board, the container and the wall */
 swz={x:5280,y:2080,w:240,h:80};
// the shop, written as it stands with its gate to the south (a 2x2-tile lot); S0 is its layout, sellZ its pink lot on the map. The office is OFFICES' 'shop'
const S0={zone:{x:3360,y:950,w:280,h:580},gate:{side:'S',a:10*TS,b:11*TS}};
let sellZ=S0.zone;
// ---- the garage as one unit. Everything of it is written once, as it stands with its gate to the east (G0 and the numbers in its code);
// GS says where its lot is and how many quarter turns (clockwise) it is turned. gRot takes a point of that layout to the map, gInv brings it back
const G0={garage:{x:1750,y:1050,w:300,h:140},gUnl:{x:1020,y:1440,w:80,h:320},gPanel:{x:1130,y:1440,w:100,h:320},gLoad:{x:1240,y:1440,w:80,h:320},gate:{side:'E',a:4*TS,b:5*TS}};
const GS={c0:4,r0:4,bc:3,br:3,rot:0},FS={c0:12,r0:4,bc:4,br:6,rot:1},MS={c0:8,r0:4,bc:1,br:0,rot:3},PS={c0:0,r0:4,bc:10,br:7,rot:3},SS={c0:1,r0:8,bc:10,br:2,n:2,rot:3},LS={c0:16,r0:4,bc:15,br:0,rot:1},SWS={c0:4,r0:8,bc:15,br:5,rot:2},QS={c0:0,r0:0,bc:15,br:8,rot:3},IRS={c0:16,r0:8,bc:0,br:8,rot:1};   // the units on the map: their lot's top-left tile and their quarter turns (clockwise)
const uC=U=>[(U.bc+(U.n||3)/2)*TS,(U.br+(U.n||3)/2)*TS],uOff=U=>[(U.c0-U.bc)*TS,(U.r0-U.br)*TS];   // the middle of the lot as its layout was written (the pivot of the turn); the move from there to where the lot stands   // the middle of its lot (3x3 tiles; the shop's is 2x2)
const uRot=(U,x,y,q=U.rot)=>{const[cx,cy]=uC(U),[ox,oy]=uOff(U);let dx=x-cx,dy=y-cy;for(let k=0;k<q;k++){const t=dx;dx=-dy;dy=t}return[cx+dx+ox,cy+dy+oy]};
const uInv=(U,x,y)=>{const[cx,cy]=uC(U),[ox,oy]=uOff(U);let dx=x-ox-cx,dy=y-oy-cy;for(let k=0;k<(4-U.rot)%4;k++){const t=dx;dx=-dy;dy=t}return[cx+dx,cy+dy]};
const uRect=(U,z)=>{const p=uRot(U,z.x,z.y);return U.rot&1?{...z,x:p[0],y:p[1],w:z.h,h:z.w}:{...z,x:p[0],y:p[1]}};
const uBox=(U,b)=>{const p=uRot(U,b.x0,b.y0),q=uRot(U,b.x1,b.y1);return{x0:Math.min(p[0],q[0]),y0:Math.min(p[1],q[1]),x1:Math.max(p[0],q[0]),y1:Math.max(p[1],q[1])}};
const uPlace=(U,o)=>{const p=uRot(U,o.x,o.y),A=U.rot*Math.PI/2;o.x=p[0];o.y=p[1];if('b' in o){o.b+=A;const h=uRot(U,o.hx,o.hy);o.hx=h[0];o.hy=h[1]}else o.a+=A};   // a vehicle or trailer placed in the layout, onto the map
