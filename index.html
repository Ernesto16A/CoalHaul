<style>

<script>
const cv=document.getElementById('c'),$=id=>document.getElementById(id);let g=cv.getContext('2d');
let VW,VH,dpr;
function rs(){dpr=Math.min(devicePixelRatio||1,2);VW=innerWidth;VH=innerHeight;cv.width=VW*dpr;cv.height=VH*dpr}
addEventListener('resize',rs);rs();

// ---------- world: an endless grid of grass tiles; the streets are tiles too ----------
const TOUCHUI=matchMedia('(pointer:coarse)').matches;   // phone / tablet: on-screen buttons, the minimap moves to the top right
const WW=6080,WH=3520,S=10,SPX=20,KS=SPX/S,TS=320;   // S: pixels per vehicle unit (half the old size). SPX: pixels per second per unit of speed, unchanged, so vehicles still cover ground as fast as before   // WW/WH only size the minimap; the map itself never ends
const RW=72,SH=84.5,RR=TS/2;         // street half-width, dirt shoulder half-width, radius of a turn tile's centre line
const NB=1,EB=2,SB=4,WB=8,ck=(c,r)=>c+','+r;
const hash=(c,r,k)=>{let h=Math.imul(c|0,374761393)+Math.imul(r|0,668265263)+Math.imul((k||0)+1,1442695041)|0;h=Math.imul(h^(h>>>13),1274126177);h^=h>>>16;return(h>>>0)/4294967296};
// 3x3 asphalt lots (coal mine, power plant), each with a one-tile entrance where a street meets it
const LOTS=[{c0:1,r0:0,c1:4,r1:3,gate:{side:'E',a:1*TS,b:2*TS}},{c0:10,r0:7,c1:13,r1:10,gate:{side:'W',a:8*TS,b:9*TS}},{c0:3,r0:3,c1:6,r1:6,gate:{side:'E',a:4*TS,b:5*TS}},{c0:16,r0:0,c1:19,r1:3,gate:{side:'W',a:1*TS,b:2*TS}},{c0:16,r0:5,c1:19,r1:8,gate:{side:'W',a:6*TS,b:7*TS}},{c0:10,r0:2,c1:12,r1:4,gate:{side:'S',a:10*TS,b:11*TS}}].map(l=>({...l,x0:l.c0*TS,y0:l.r0*TS,x1:l.c1*TS,y1:l.r1*TS}));
const LOTT=new Set();for(const l of LOTS)for(let c=l.c0;c<l.c1;c++)for(let r=l.r0;r<l.r1;r++)LOTT.add(ck(c,r));
const RC=new Map();   // street tiles -> the sides they connect to
function link(c,r,nc,nr){const add=(x,y,m)=>{const k=ck(x,y);if(!LOTT.has(k))RC.set(k,(RC.get(k)||0)|m)};
 if(nc>c){add(c,r,EB);add(nc,nr,WB)}else if(nc<c){add(c,r,WB);add(nc,nr,EB)}else if(nr>r){add(c,r,SB);add(nc,nr,NB)}else{add(c,r,NB);add(nc,nr,SB)}}
function road(...p){for(let i=0;i<p.length-1;i++){let c=p[i][0],r=p[i][1];const c2=p[i+1][0],r2=p[i+1][1],dc=Math.sign(c2-c),dr=Math.sign(r2-r);while(c!==c2||r!==r2){link(c,r,c+dc,r+dr);c+=dc;r+=dr}}}
// a tile with exactly two perpendicular connections is a turn: its street bends around the tile corner they share
const corner=m=>m===(EB|SB)?[1,1]:m===(EB|NB)?[1,-1]:m===(WB|SB)?[-1,1]:m===(WB|NB)?[-1,-1]:null;
// tile coordinates (column,row); one tile is 320 px. A 3x3 site is a ring of eight street tiles (four turns, four straights) around an island tile.
road([3,1],[7,1],[7,10]);              // coal mine, then the trunk straight down to the southern corner
road([5,1],[5,0],[7,0],[7,1]);         // fuel station loop
road([7,4],[5,4]);                     // garage spur (west)
road([7,8],[10,8]);                    // power plant spur (east)
road([7,4],[14,4],[14,10],[7,10]);
road([10,4],[10,3]);                   // shop gate (south side)     // the big east ring, with its corners
road([14,4],[14,1],[16,1]);            // lumberyard road
road([14,6],[16,6]);                   // sawmill spur

// loading / unloading places sit on straight street tiles
const load={x:368,y:480,w:80,h:224}, dump={x:3840,y:2400,w:224,h:80}, lz={x:5760,y:160,w:224,h:80}, garage={x:1750,y:1060,w:340,h:88}, sellZ={x:3360,y:1090,w:88,h:300}, fz={x:2080,y:160,w:28,h:16,a:0}, swz={x:5760,y:1760,w:224,h:80};
const gUnl={x:1012,y:1440,w:92,h:300},gPanel={x:1116,y:1440,w:100,h:300},gLoad={x:1222,y:1440,w:92,h:300},STORE={coal:0,logs:0,fuel:0},STMAX=1000;const STCAP={coal:50,logs:50,fuel:50};   // garage: unload into storage, storage list, load out of storage
LOTS[0].stop=load.x+load.w/2+8;LOTS[1].stop=dump.x-dump.w/2-8;
const Y=(c0,r0,c1,r1,c)=>({x0:c0*TS,y0:r0*TS,x1:c1*TS,y1:r1*TS,c});   // gravel yards, in whole tiles
const yards=[Y(5,0,8,2,'#80838a')];
const inRect=(r,x,y,m=0)=>x>r.x0-m&&x<r.x1+m&&y>r.y0-m&&y<r.y1+m;
const inYard=(x,y)=>yards.some(r=>inRect(r,x,y));
function distSeg(px,py,a,b){const dx=b[0]-a[0],dy=b[1]-a[1],t=Math.max(0,Math.min(1,((px-a[0])*dx+(py-a[1])*dy)/(dx*dx+dy*dy||1)));return Math.hypot(px-(a[0]+t*dx),py-(a[1]+t*dy))}
function onRoad(x,y){if(inYard(x,y)||LOTS.some(l=>inRect(l,x,y)))return true;
 const c=Math.floor(x/TS),r=Math.floor(y/TS),m=RC.get(ck(c,r));if(m===undefined)return false;
 const lx=x-(c*TS+TS/2),ly=y-(r*TS+TS/2),w=78,cn=corner(m);
 if(cn){const d=Math.hypot(lx-cn[0]*TS/2,ly-cn[1]*TS/2);return d>RR-w&&d<RR+w}
 return(Math.abs(lx)<=w&&Math.abs(ly)<=w)||(m&NB&&ly<0&&Math.abs(lx)<=w)||(m&SB&&ly>0&&Math.abs(lx)<=w)||(m&EB&&lx>0&&Math.abs(ly)<=w)||(m&WB&&lx<0&&Math.abs(ly)<=w)}
// centre lines of the street tiles, so trees can keep away from them
const SEGS=new Map();
for(const[k,m]of RC){const q=k.split(','),cx=q[0]*TS+TS/2,cy=q[1]*TS+TS/2,cn=corner(m),L=[];
 if(cn){const px=cx+cn[0]*TS/2,py=cy+cn[1]*TS/2,a0=cn[0]>0?(cn[1]>0?Math.PI:Math.PI/2):(cn[1]>0?Math.PI*1.5:0);let pr=null;
  for(let i=0;i<=8;i++){const an=a0+i*Math.PI/16,pt=[px+Math.cos(an)*RR,py+Math.sin(an)*RR];if(pr)L.push([pr,pt]);pr=pt}}
 else{const c0=[cx,cy];L.push([c0,c0]);if(m&NB)L.push([c0,[cx,cy-TS/2]]);if(m&SB)L.push([c0,[cx,cy+TS/2]]);if(m&EB)L.push([c0,[cx+TS/2,cy]]);if(m&WB)L.push([c0,[cx-TS/2,cy]])}
 SEGS.set(k,L)}
function nearRoad(x,y,m){const c=Math.floor(x/TS),r=Math.floor(y/TS);
 for(let i=-1;i<=1;i++)for(let j=-1;j<=1;j++){const L=SEGS.get(ck(c+i,r+j));if(L)for(const sg of L)if(distSeg(x,y,sg[0],sg[1])<m)return true}
 return false}

// ---------- buildings & economy ----------
let power=0,plantRun=false;
const mine={stock:50,cap:50,lvl:0,rate:.1,name:'Coal mine',unit:'t'};   // the coal mine regenerates 0.1 t per second
const plant={stock:0,cap:50,lvl:0,burn:1,name:'Power plant',unit:'t'};
const lumber={built:false,need:10,got:0,stock:0,cap:50,lvl:0,rate:.8,name:'Lumberyard',unit:'logs'};
const sawmill={built:false,need:10,got:0,stock:0,cap:50,lvl:0,burn:1,name:'Sawmill',unit:'logs'};let planks=0;
// office containers (the way in on foot, with the upgrade panel inside), one per big site
const OFFICES=[{X:990,Y:164,get b(){return mine},n:'mine'},{X:3340,Y:2404,get b(){return plant},n:'power plant'},{X:5260,Y:164,get b(){return lumber},n:'lumberyard'},{X:5260,Y:1764,get b(){return sawmill},n:'sawmill'},{X:3600,Y:1040,label:'SHOP',n:'shop',rot:1},{X:1704,Y:1148,rooms:3,eh:132,sl:66,label:'HOME',n:'garage'}];
const pads=[{x:-3860,y:-4110,w:110,h:80,enter:1,own:'garage'},{x:-4140,y:-4110,w:110,h:80,gup:1,own:'garage'},{x:-4000,y:-4048,w:110,h:80,shop:1,own:'shop'},{x:-4000,y:-4048,w:110,h:80,b:mine,inside:1,up:1},{x:-4000,y:-3890,w:110,h:40,exit:1,inside:1}];
const MAXLVL=19,STEP=50,upCost=b=>125*(b.lvl+1);
// ---------- collision: kerbs (vehicles stay on tarmac), lot walls, gate posts and buildings. The Test panel can switch it off ----------
let COLL=true;
const WALLS=[],BLDS=[];
{const add=(x0,y0,x1,y1)=>WALLS.push({x0:Math.min(x0,x1)-4,y0:Math.min(y0,y1)-4,x1:Math.max(x0,x1)+4,y1:Math.max(y0,y1)+4});
 for(const l of LOTS){const gt=l.gate;
  add(l.x0,l.y0,l.x1,l.y0);
  if(gt.side==='S'){add(l.x0,l.y1,gt.a,l.y1);add(gt.b,l.y1,l.x1,l.y1);add(gt.a-4,l.y1-4,gt.a+4,l.y1+4);add(gt.b-4,l.y1-4,gt.b+4,l.y1+4)}else add(l.x0,l.y1,l.x1,l.y1);
  for(const sd of['W','E']){const x=sd==='W'?l.x0:l.x1;if(gt.side===sd){add(x,l.y0,x,gt.a);add(x,gt.b,x,l.y1);add(x-4,gt.a-4,x+4,gt.a+4);add(x-4,gt.b-4,x+4,gt.b+4)}else add(x,l.y0,x,l.y1)}}
 const bx=(x0,y0,x1,y1)=>BLDS.push({x0,y0,x1,y1});
 bx(1965,284,2195,334);for(const x of[2010,2080,2150])bx(x-9,242,x+9,266);            // fuel station and its pumps
 for(const[x,y]of[[969,20],[3319,2260],[5239,20],[5239,1620]])bx(x,y,x+192,y+96)}    // the grey readout boards behind the offices
const offRect=o=>o.rot?{x0:o.X,y0:o.Y,x1:o.X+66*(o.rooms||2),y1:o.Y+150}:{x0:o.X-(o.sl||0),y0:o.Y,x1:o.X+150+(o.sl||0),y1:o.Y+(o.eh||66*(o.rooms||2))};
const inBox=(r,x,y,m)=>x>r.x0-m&&x<r.x1+m&&y>r.y0-m&&y<r.y1+m;
const envSolid=(x,y)=>{if(!onRoad(x,y))return true;
 for(const r of WALLS)if(inBox(r,x,y,3))return true;for(const r of BLDS)if(inBox(r,x,y,3))return true;for(const o of OFFICES)if(inBox(offRect(o),x,y,3))return true;return false};
function envBad(tx,ty,ta,pz){const ch=chain();
 for(const b of[vBody(T,tx,ty,ta),...ch.map((t,i)=>tBody(t,pz[i][0],pz[i][1],pz[i][2]))])for(const[u,v]of rectPts(b.x0,b.x1,b.h)){const w=wld(u*S,v*S,b.ox,b.oy,b.a);if(envSolid(w[0],w[1]))return true}
 return false}
// the player on foot: walls, buildings and offices push him out (grass is free to walk on)
function pushBlock(){const r=6,fix=b=>{const x0=b.x0-r,x1=b.x1+r,y0=b.y0-r,y1=b.y1+r;if(P.x>x0&&P.x<x1&&P.y>y0&&P.y<y1){const d=[P.x-x0,x1-P.x,P.y-y0,y1-P.y],m=Math.min(...d);if(m==d[0])P.x=x0;else if(m==d[1])P.x=x1;else if(m==d[2])P.y=y0;else P.y=y1}};
 for(const o of OFFICES)fix(offRect(o));for(const b of BLDS)fix(b);for(const w of WALLS)fix(w)}
const DMAX=120,DA0=135,DSW=270,dial=(()=>{const c=60,cy=58,r=46,pt=(a,d)=>[c+Math.cos(a*Math.PI/180)*d,cy+Math.sin(a*Math.PI/180)*d],f=n=>n.toFixed(1);
